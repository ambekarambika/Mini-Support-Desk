<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Support Desk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1 class="app-title">Mini Support Desk</h1>
            <p class="app-subtitle">Client support tickets at a glance</p>
        </div>
    </header>

    <main class="main-content">
        <!-- Toast / Alert Message Banner -->
        <div id="alert-banner" class="alert-banner hidden" role="alert" aria-live="polite"></div>

        <!-- Dashboard Statistics Section -->
        <section class="stats-section" aria-label="Dashboard Statistics">
            <div class="stat-card">
                <span class="stat-label">Total Tickets</span>
                <span class="stat-value" id="stat-total">—</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Open</span>
                <span class="stat-value status-open" id="stat-open">—</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">In Progress</span>
                <span class="stat-value status-in-progress" id="stat-in-progress">—</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Resolved</span>
                <span class="stat-value status-resolved" id="stat-resolved">—</span>
            </div>
        </section>

        <!-- Support Pulse / Attention Queue Section -->
        <section class="pulse-section" aria-label="Support Pulse">
            <div class="section-header">
                <h2>Support Pulse</h2>
                <p class="section-description">Tickets that may need attention based on priority, status, and age.</p>
            </div>
            <div id="pulse-container" class="pulse-container">
                <p class="empty-text">No tickets require immediate attention.</p>
            </div>
        </section>

        <!-- Main Ticket Management Section -->
        <section class="tickets-section" aria-label="Support Tickets Management">
            <!-- Ticket Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <label for="search-input" class="sr-only">Search Tickets</label>
                    <input type="search" id="search-input" placeholder="Search by title or client...">
                </div>
                <div class="filter-group">
                    <label for="status-filter" class="sr-only">Filter by Status</label>
                    <select id="status-filter">
                        <option value="">All Statuses</option>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>

                    <label for="priority-filter" class="sr-only">Filter by Priority</label>
                    <select id="priority-filter">
                        <option value="">All Priorities</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>

                    <button type="button" id="btn-clear-filters" class="btn btn-secondary">Clear</button>
                </div>
                <button type="button" id="btn-new-ticket" class="btn btn-primary">+ New Ticket</button>
            </div>

            <!-- Ticket List Area -->
            <div class="section-header">
                <h2>Support Tickets</h2>
            </div>
            <div id="ticket-list" class="ticket-list">
                <p class="empty-text">No tickets found.</p>
            </div>
        </section>
    </main>

    <!-- Modal Container for Ticket Details & Create Form (Hidden by default) -->
    <div id="modal-container" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h3 id="modal-title">Create Ticket</h3>
                <button type="button" id="btn-close-modal" class="btn-close" aria-label="Close modal">&times;</button>
            </div>
            <div id="modal-body" class="modal-body">
                <!-- Content will be populated dynamically -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
